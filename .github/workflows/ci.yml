name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, Lint & Security Audit (Bun)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check for committed environment secrets
        run: |
          if [ -f .env ]; then
            echo "ERROR: Tracked .env detected in repository tree!"
            exit 1
          fi

      - name: Install dependencies (reproducible frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run automated test suite
        run: bun test

      - name: Run TypeScript typecheck
        run: bun run typecheck

      - name: Run code linter (blocking)
        run: bun run lint

  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (reproducible frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build production bundle
        env:
          VITE_SUPABASE_PROJECT_ID: "ci-mock-project"
          VITE_SUPABASE_URL: "https://ci-mock-project.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_mock_key"
          SUPABASE_PROJECT_ID: "ci-mock-project"
          SUPABASE_URL: "https://ci-mock-project.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_mock_key"
        run: bun run build
