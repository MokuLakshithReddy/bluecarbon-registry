name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, Lint & Security Audit (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history for secret audit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Check for committed environment secrets
        run: |
          if [ -f .env ]; then
            echo "ERROR: Tracked .env detected in repository tree!"
            exit 1
          fi

      - name: Install dependencies (reproducible clean install)
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run code linter (blocking)
        run: npm run lint

      - name: Run Gitleaks Secret Scanner (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run security audit and fail-closed secret scanner
        env:
          STRICT_AUDIT: "true"
        run: npm run audit:security

      - name: Run EVM deployment & contract RBAC test suite
        run: npm run test:evm

  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies (reproducible clean install)
        run: npm ci

      - name: Build production bundle
        env:
          VITE_SUPABASE_PROJECT_ID: "ci-mock-project"
          VITE_SUPABASE_URL: "https://ci-mock-project.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_mock_key"
          SUPABASE_PROJECT_ID: "ci-mock-project"
          SUPABASE_URL: "https://ci-mock-project.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_mock_key"
        run: npm run build
